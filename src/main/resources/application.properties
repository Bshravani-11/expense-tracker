# Server Configuration
server.port=8080

# Application Name
spring.application.name=expense-tracker

# Jackson JSON Configuration
# Ensure dates like LocalDate and LocalDateTime are serialized in standard ISO format (e.g. "2026-10-19")
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd

# Static Content Configuration
# Spring Boot automatically serves static HTML, CSS, and JS from classpath:/static/
spring.web.resources.static-locations=classpath:/static/

# Logging
logging.level.com.example.expensetracker=INFO
